name: build-site

# Builds the unified lumenfx.dev site. Product docs are cloned fresh at build
# time (see scripts/prebuild.py); nothing docs-related is committed here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      candela_rev:
        description: "candela rev to build (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Default to main. A release bumps this to a pinned tag or SHA, either by
      # editing this default or via the workflow_dispatch input above.
      CANDELA_REV: ${{ github.event.inputs.candela_rev || 'main' }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Assemble docs (clone product docs fresh)
        run: uv run python scripts/prebuild.py

      - name: Build static site
        run: uv run zensical build --strict

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

      # Deploy to Cloudflare Pages. Runs on push to main and manual dispatch,
      # not on pull requests (those only validate the build above). Creates the
      # Pages project on first run, then uploads dist/. Secrets are org-level:
      # CLOUDFLARE_ACCOUNT = account id, CLOUDFLARE_API_KEY = an API token with
      # Account > Cloudflare Pages > Edit (wrangler reads it as CLOUDFLARE_API_TOKEN).
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          # Create the project on first deploy; a already-exists error is fine.
          npx --yes wrangler@4 pages project create lumenfx --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=lumenfx --branch=main
