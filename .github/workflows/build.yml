name: build-site

# Builds the three static targets (apex, candela, docs) and deploys each to its
# own Cloudflare Pages project. Product docs are cloned fresh at build time (see
# scripts/prebuild.py); nothing docs-related is committed here. The docs and the
# landing code samples come from each product's latest release, so they
# describe the version a visitor can install.
#
# Each target is a self-contained static build served at a domain root:
#   apex    -> lumenfx.dev          Pages project: lumenfx          (Vite + React)
#   candela -> candela.lumenfx.dev  Pages project: lumenfx-candela  (Vite + React)
#   docs    -> docs.lumenfx.dev     Pages project: lumenfx-docs     (Zensical)
#
# Pages projects are pure static (no Functions, no _middleware, no Workers).
# Custom domains are attached per project in the Cloudflare dashboard by the
# owner.

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each queued group on its own branch; without this
  # trigger the required `build` check never reports there and the queue
  # times out and drops the PR.
  merge_group:
  # Product repos (lumen, candela) send this from their own CI, so docs and
  # install.sh redeploy without a manual dispatch.
  repository_dispatch:
    types: [product-updated]
  # Daily fallback for a missed dispatch or a product repo whose sender is
  # not set up yet.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      candela_rev:
        description: "candela rev to build the docs from (branch, tag, or SHA; empty = latest release)"
        required: false
        default: ""
      lumen_rev:
        description: "lumen rev to build the docs from (branch, tag, or SHA; empty = latest release)"
        required: false
        default: ""
      candela_wasm_tag:
        description: "candela release to take the browser runtime from"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      # LUMEN_REV and CANDELA_REV pick the rev the docs and the landing code
      # samples are cloned from. Each defaults to the product's latest release
      # tag; releases/latest skips prereleases, so the rolling nightly is never
      # picked. A workflow_dispatch input overrides it, e.g. lumen_rev=main to
      # ship an urgent docs fix before the next release. If the lookup fails
      # the build fails: silently building main would publish docs for features
      # nobody can install yet. The installers stay on main (see below).
      - name: Resolve product revs
        env:
          GH_TOKEN: ${{ github.token }}
          LUMEN_INPUT: ${{ github.event.inputs.lumen_rev }}
          CANDELA_INPUT: ${{ github.event.inputs.candela_rev }}
        run: |
          set -euo pipefail
          resolve() {
            local repo="$1" input="$2" tag
            if [ -n "$input" ]; then
              echo "$input"
              return
            fi
            if ! tag=$(gh api "repos/lumen-fx/$repo/releases/latest" -q .tag_name) || [ -z "$tag" ]; then
              echo "::error::could not resolve the latest release of lumen-fx/$repo; set the ${repo}_rev input to build a specific rev" >&2
              return 1
            fi
            echo "$tag"
          }
          lumen=$(resolve lumen "$LUMEN_INPUT")
          candela=$(resolve candela "$CANDELA_INPUT")
          echo "lumen docs @ $lumen, candela docs @ $candela"
          echo "LUMEN_REV=$lumen" >> "$GITHUB_ENV"
          echo "CANDELA_REV=$candela" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node (for the landings)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/lumen/package-lock.json
            apps/candela/package-lock.json

      - name: Sync dependencies
        run: uv sync

      # Only docs is Zensical. prebuild assembles its docs_dir by cloning both
      # product doc sets fresh, and generates its config.
      - name: Assemble docs (clone product docs fresh)
        run: uv run python scripts/prebuild.py

      - name: Build docs (zensical)
        run: uv run zensical build --strict -f zensical.docs.toml

      # Both landings show code. Every example whose source is a file in a
      # product repo is read from that repo here, so a page cannot show an API
      # that no longer exists. A moved or deleted source fails the build.
      - name: Fetch code examples
        run: uv run python scripts/fetch_examples.py

      # The Lumen landing is a static Vite + React app. Fetch install.sh fresh
      # from the lumen repo so it ships at lumenfx.dev/install.sh, then build
      # to dist/apex. The installer is taken from main (LUMEN_INSTALL_REV),
      # not from the release the docs follow, so an installer fix ships
      # without waiting for a release.
      - name: Package lumen install.sh
        run: uv run python scripts/fetch_lumen_install.py

      - name: Install lumen landing deps
        run: npm --prefix apps/lumen ci

      - name: Build lumen landing (vite)
        run: npm --prefix apps/lumen run build

      # The Candela landing is a static Vite + React app. Fetch install.sh fresh
      # from the candela repo so it ships at candela.lumenfx.dev/install.sh, then
      # build to dist/candela. Like the Lumen one, it comes from main
      # (CANDELA_INSTALL_REV).
      - name: Package candela install.sh
        run: uv run python scripts/fetch_candela_install.py

      # The prompt on that landing runs candela in the browser. The runtime it
      # loads is the web asset from a candela release, so the page and the
      # toolchain a visitor installs come from one source at one version.
      # GITHUB_TOKEN only raises the API rate limit for reading the release.
      - name: Fetch the candela runtime (wasm)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDELA_WASM_TAG: ${{ github.event.inputs.candela_wasm_tag || 'latest' }}
        run: uv run python scripts/fetch_candela_wasm.py

      - name: Install candela landing deps
        run: npm --prefix apps/candela ci

      - name: Build candela landing (vite)
        run: npm --prefix apps/candela run build

      - name: Upload static site artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sites
          path: dist

      # Deploy each target to its own Cloudflare Pages project. Runs on push to
      # main and manual dispatch, not on pull requests or merge-queue builds
      # (those only validate the build above). Creates each project on first
      # run; an already-exists error is fine. Secrets are org-level: CLOUDFLARE_ACCOUNT = account id,
      # CLOUDFLARE_API_KEY = an API token with Account > Cloudflare Pages > Edit
      # (wrangler reads it as CLOUDFLARE_API_TOKEN).
      - name: Deploy apex to Cloudflare Pages (lumenfx)
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          npx --yes wrangler@4 pages project create lumenfx --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist/apex --project-name=lumenfx --branch=main

      - name: Deploy candela to Cloudflare Pages (lumenfx-candela)
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          npx --yes wrangler@4 pages project create lumenfx-candela --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist/candela --project-name=lumenfx-candela --branch=main

      - name: Deploy docs to Cloudflare Pages (lumenfx-docs)
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          npx --yes wrangler@4 pages project create lumenfx-docs --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist/docs --project-name=lumenfx-docs --branch=main
