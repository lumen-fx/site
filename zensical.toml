# Unified lumenfx.dev site. The theme settings (palette, features, markdown
# extensions) are carried from the candela docs config so candela, Lumen, and
# the landings render as one site.
#
# The docs_dir is generated by scripts/prebuild.py and is not committed. Run
# that script (which clones product docs fresh) before `zensical build`.

[project]

site_name = "Lumen FX"
site_description = "Lumen is a Rust desktop UI framework. Candela is its scripting language. Unified docs and landings for lumenfx.dev."
site_author = "Lumen FX"
site_url = "https://lumenfx.dev"

repo_url = "https://github.com/lumen-fx/site"
repo_name = "lumen-fx/site"

copyright = """
Copyright &copy; 2026 Lumen FX
"""

# The Zensical docs_dir is assembled by scripts/prebuild.py. site_dir is the
# built static output. Both are generated and gitignored.
docs_dir = "build/docs"
site_dir = "dist"

nav = [
  {"Home" = "index.md"},
  {"Lumen" = [
     "lumen/index.md",
  ]},
  {"Candela" = [
     "candela/index.md",
     {"Docs" = [
        "candela/docs/index.md",
        {"Language tour" = [
           "candela/docs/language-tour/hello-world.md",
           "candela/docs/language-tour/variables.md",
           "candela/docs/language-tour/data-types.md",
           "candela/docs/language-tour/functions.md",
           "candela/docs/language-tour/control-flow.md",
           "candela/docs/language-tour/error-handling.md",
           "candela/docs/language-tour/modules.md",
           "candela/docs/language-tour/dynamic-libraries.md",
           "candela/docs/language-tour/embedding.md",
        ]},
        {"Reference" = [
           "candela/docs/reference/operators.md",
           "candela/docs/reference/errors.md",
        ]},
        {"Standard library" = [
           "candela/docs/standard-library/built-in-functions.md",
           "candela/docs/standard-library/assert.md",
           "candela/docs/standard-library/convert.md",
           "candela/docs/standard-library/fs.md",
           "candela/docs/standard-library/list.md",
           "candela/docs/standard-library/math.md",
           "candela/docs/standard-library/random.md",
           "candela/docs/standard-library/string.md",
           "candela/docs/standard-library/time.md",
        ]},
     ]},
  ]},
]

extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

# Logos are not finalized. The header falls back to the site_name text
# wordmark. TODO: set `logo` to a real asset once branding lands.
favicon = "images/favicon.png"
language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
accent = "blue"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "blue"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Extra
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lumen-fx"

# ----------------------------------------------------------------------------
# Markdown extensions (carried from the candela docs config)
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.zensical.extensions.glightbox]
auto = true
[project.markdown_extensions.zensical.extensions.preview]
configurations = [
    { targets.include = [
        "*.md"
    ]}
]
[project.plugins.offline]
